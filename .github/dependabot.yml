version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    rebase-strategy: auto
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # El plugin de Rollup para TypeScript todavía depende de APIs retiradas en TS 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Los tipos deben seguir la versión de Node usada por Stream Deck y por CI.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Bogota
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
