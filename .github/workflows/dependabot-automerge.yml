name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  safe-update:
    name: Preparar auto-merge seguro
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'MAECLY/stream-deck-windows-xbox-settings'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # No se descarga ni ejecuta código del PR en este workflow privilegiado.
      - name: Leer metadatos verificados de Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Activar auto-merge para cambios minor y patch
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
