<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960">
  <rect width="1920" height="960" fill="#0a0a0b"/>

  <!-- ============ LEFT: text block ============ -->
  <text x="90" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" letter-spacing="3" fill="#7e7e8a">TWO-WAY</text>

  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">
    <text x="90" y="232" fill="#f2f2f3">Press the key,</text>
    <text x="90" y="306" fill="#f2f2f3">Windows follows.</text>
    <text x="90" y="410" fill="#7e7e8a">Change Windows,</text>
    <text x="90" y="484" fill="#7e7e8a">the key follows.</text>
  </g>

  <line x1="90" y1="534" x2="620" y2="534" stroke="#232327" stroke-width="1"/>

  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="28" font-weight="400" fill="#a3a3ad">
    <text x="90" y="586">The plugin writes the value and reads</text>
    <text x="90" y="626">it back to confirm. It re-checks every</text>
    <text x="90" y="666">2.5 seconds, so flipping the switch</text>
    <text x="90" y="706">in Settings redraws the key too.</text>
  </g>

  <!-- ============ RIGHT: diagram ============ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="3" fill="#7e7e8a">
    <text x="750" y="238">STREAM DECK</text>
    <text x="1089" y="238">WINDOWS SETTINGS</text>
  </g>

  <!-- key 1 : Game Mode -->
  <g transform="translate(750,290) scale(1.041667)">
    <rect width="144" height="144" rx="24" fill="#107c10"/>
    <g transform="translate(8.06 -10.09) scale(.92)">
      <path fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="14" stroke-linecap="round" d="M36 98A40 40 0 1 1 108 98"/>
      <path fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" d="M36 98A40 40 0 0 1 100 50"/>
      <path fill="#fff" d="M78 34L50 80h16l-7 30 27-44H76z"/>
    </g>
  </g>

  <!-- key 2 : Game Bar -->
  <g transform="translate(750,480) scale(1.041667)">
    <rect width="144" height="144" rx="24" fill="#107c10"/>
    <g transform="translate(7.65 -1.55) scale(.9)">
      <rect x="36" y="18" width="72" height="22" rx="7" fill="#fff"/>
      <g fill="#107c10"><circle cx="49" cy="29" r="3.2"/><circle cx="61" cy="29" r="3.2"/><rect x="71" y="25.8" width="24" height="6.4" rx="3.2"/></g>
      <g transform="translate(27.36 23.06) scale(.62)"><path fill="#fff" d="M12 84C12 58 24 42 46 39C55 38 62 37 72 37C82 37 89 40 98 39C120 42 132 58 132 84C132 108 127 126 111 126C99 126 93 115 89 104C86 98 82 100 76 100L68 100C62 100 58 98 55 104C51 115 45 126 33 126C17 126 12 108 12 84Z"/><g fill="#107c10"><circle cx="43" cy="60" r="10"/><path d="M49 78h8v-8h7v8h8v7h-8v8h-7v-8h-8z"/><circle cx="84" cy="82" r="9"/><circle cx="101" cy="49" r="5.5"/><circle cx="90" cy="60" r="5.5"/><circle cx="112" cy="60" r="5.5"/><circle cx="101" cy="71" r="5.5"/></g></g>
    </g>
  </g>

  <!-- bidirectional connectors -->
  <g>
    <line x1="934" y1="365" x2="1055" y2="365" stroke="#34343a" stroke-width="3"/>
    <path d="M914 365 L934 356 L934 374 Z" fill="#a3a3ad"/>
    <path d="M1075 365 L1055 356 L1055 374 Z" fill="#a3a3ad"/>

    <line x1="934" y1="555" x2="1055" y2="555" stroke="#34343a" stroke-width="3"/>
    <path d="M914 555 L934 546 L934 564 Z" fill="#a3a3ad"/>
    <path d="M1075 555 L1055 546 L1055 564 Z" fill="#a3a3ad"/>
  </g>

  <!-- Windows Settings page -->
  <rect x="1089" y="264" width="741" height="391" rx="8" fill="#202020"/>

  <g transform="translate(1117.5,292.5) scale(1.9)">
    <!-- card 1 -->
    <g>
      <rect width="360" height="76" rx="4" fill="#2b2b2b"/>
      <text x="16" y="34" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14" fill="#ffffff">Game Mode</text>
      <text x="16" y="53" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9b9b9b">AutoGameModeEnabled</text>
      <rect x="304" y="28" width="40" height="20" rx="10" fill="#4cc2ff"/>
      <circle cx="334" cy="38" r="6" fill="#0a0a0b"/>
    </g>
    <!-- card 2 -->
    <g transform="translate(0,100)">
      <rect width="360" height="76" rx="4" fill="#2b2b2b"/>
      <text x="16" y="34" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14" fill="#ffffff">Allow your controller to open Game Bar</text>
      <text x="16" y="53" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9b9b9b">UseNexusForGameBarEnabled</text>
      <rect x="304" y="28" width="40" height="20" rx="10" fill="#4cc2ff"/>
      <circle cx="334" cy="38" r="6" fill="#0a0a0b"/>
    </g>
  </g>

  <!-- ============ FOOTER ============ -->
  <line x1="90" y1="790" x2="1830" y2="790" stroke="#232327" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#7e7e8a">
    <text x="90" y="832">HKCU\Software\Microsoft\GameBar</text>
    <text x="1830" y="832" text-anchor="end">BROADCAST ON WRITE · RE-POLL 2.5 S</text>
  </g>
</svg>
