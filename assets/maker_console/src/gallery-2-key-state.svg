<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960"
     data-slide="gallery-2-states" role="img"
     aria-label="Gaming Toggles for PC — the key face shows the state you actually have">
  <title>gallery-2-states</title>

  <rect width="1920" height="960" fill="#0a0a0b"/>

  <!-- ================= LEFT COLUMN ================= -->
  <text x="96" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="21" letter-spacing="3" fill="#7e7e8a">02 — KEY STATE</text>

  <text x="96" y="238" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-2" fill="#f2f2f3">The key shows</text>
  <text x="96" y="312" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-2" fill="#f2f2f3">the state you</text>
  <text x="96" y="386" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-2" fill="#f2f2f3">actually have.</text>

  <text x="96" y="464" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="28" fill="#a3a3ad">The plugin writes the value, reads it</text>
  <text x="96" y="502" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="28" fill="#a3a3ad">straight back, then re-reads it every</text>
  <text x="96" y="540" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="28" fill="#a3a3ad">2.5 seconds. Nothing is assumed.</text>

  <!-- machine facts -->
  <rect x="96" y="604" width="684" height="1" fill="#232327"/>
  <text x="96" y="640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" letter-spacing="3" fill="#7e7e8a">SOURCE</text>
  <text x="96" y="674" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="21" fill="#a3a3ad">HKCU\Software\Microsoft\GameBar</text>
  <rect x="96" y="702" width="684" height="1" fill="#232327"/>
  <text x="96" y="738" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" letter-spacing="3" fill="#7e7e8a">POLL</text>
  <text x="96" y="772" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="21" fill="#a3a3ad">2500 ms · no admin rights</text>
  <rect x="96" y="800" width="684" height="1" fill="#232327"/>

  <text x="96" y="840" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="20" fill="#7e7e8a">Independent plugin. Not affiliated with Microsoft.</text>

  <!-- ================= STRUCTURAL RULE ================= -->
  <rect x="840" y="96" width="1" height="756" fill="#232327"/>

  <!-- ================= RIGHT MATRIX ================= -->
  <text x="904" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="21" letter-spacing="3" fill="#7e7e8a">SETTING</text>
  <text x="1240" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="21" letter-spacing="3" fill="#7e7e8a">OFF = 0</text>
  <text x="1564" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="21" letter-spacing="3" fill="#46c246">ON = 1</text>
  <rect x="904" y="146" width="920" height="1" fill="#232327"/>
  <rect x="904" y="852" width="920" height="1" fill="#232327"/>

  <!-- row 1 label -->
  <text x="904" y="298" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="27" fill="#f2f2f3">Game Mode</text>
  <text x="904" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" fill="#7e7e8a">AutoGameModeEnabled</text>

  <!-- row 2 label -->
  <text x="904" y="638" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="27" fill="#f2f2f3">Xbox button</text>
  <text x="904" y="674" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="27" fill="#f2f2f3">opens Game Bar</text>
  <text x="904" y="708" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="20" fill="#7e7e8a">on your controller</text>
  <text x="904" y="744" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" fill="#7e7e8a">UseNexusForGameBarEnabled</text>

  <!-- row 1 keys: 260 = 144 x 1.8055556 -->
  <g transform="translate(1240 180) scale(1.8055556)">
    <rect width="144" height="144" rx="24" fill="#1a1a1d"/>
    <g transform="translate(8.06 -10.09) scale(.92)">
      <path fill="none" stroke="#4a4a50" stroke-width="14" stroke-linecap="round" d="M36 98A40 40 0 1 1 108 98"/>
      <path fill="#8a8a90" d="M78 34L50 80h16l-7 30 27-44H76z"/>
    </g>
  </g>

  <g transform="translate(1564 180) scale(1.8055556)">
    <rect width="144" height="144" rx="24" fill="#107c10"/>
    <g transform="translate(8.06 -10.09) scale(.92)">
      <path fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="14" stroke-linecap="round" d="M36 98A40 40 0 1 1 108 98"/>
      <path fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" d="M36 98A40 40 0 0 1 100 50"/>
      <path fill="#fff" d="M78 34L50 80h16l-7 30 27-44H76z"/>
    </g>
  </g>

  <!-- row 2 keys -->
  <g transform="translate(1240 548) scale(1.8055556)">
    <rect width="144" height="144" rx="24" fill="#1a1a1d"/>
    <g transform="translate(7.65 -1.55) scale(.9)">
      <rect x="39.5" y="21.5" width="65" height="15" rx="7.5" fill="none" stroke="#4a4a50" stroke-width="7"/>
      <g transform="translate(27.36 23.06) scale(.62)">
        <path fill="#8a8a90" d="M12 84C12 58 24 42 46 39C55 38 62 37 72 37C82 37 89 40 98 39C120 42 132 58 132 84C132 108 127 126 111 126C99 126 93 115 89 104C86 98 82 100 76 100L68 100C62 100 58 98 55 104C51 115 45 126 33 126C17 126 12 108 12 84Z"/>
        <g fill="#1a1a1d"><circle cx="43" cy="60" r="10"/><path d="M49 78h8v-8h7v8h8v7h-8v8h-7v-8h-8z"/><circle cx="84" cy="82" r="9"/><circle cx="101" cy="49" r="5.5"/><circle cx="90" cy="60" r="5.5"/><circle cx="112" cy="60" r="5.5"/><circle cx="101" cy="71" r="5.5"/></g>
      </g>
    </g>
  </g>

  <g transform="translate(1564 548) scale(1.8055556)">
    <rect width="144" height="144" rx="24" fill="#107c10"/>
    <g transform="translate(7.65 -1.55) scale(.9)">
      <rect x="36" y="18" width="72" height="22" rx="7" fill="#fff"/>
      <g fill="#107c10"><circle cx="49" cy="29" r="3.2"/><circle cx="61" cy="29" r="3.2"/><rect x="71" y="25.8" width="24" height="6.4" rx="3.2"/></g>
      <g transform="translate(27.36 23.06) scale(.62)">
        <path fill="#fff" d="M12 84C12 58 24 42 46 39C55 38 62 37 72 37C82 37 89 40 98 39C120 42 132 58 132 84C132 108 127 126 111 126C99 126 93 115 89 104C86 98 82 100 76 100L68 100C62 100 58 98 55 104C51 115 45 126 33 126C17 126 12 108 12 84Z"/>
        <g fill="#107c10"><circle cx="43" cy="60" r="10"/><path d="M49 78h8v-8h7v8h8v7h-8v8h-7v-8h-8z"/><circle cx="84" cy="82" r="9"/><circle cx="101" cy="49" r="5.5"/><circle cx="90" cy="60" r="5.5"/><circle cx="112" cy="60" r="5.5"/><circle cx="101" cy="71" r="5.5"/></g>
      </g>
    </g>
  </g>
</svg>
