<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960" role="img" aria-label="Boolean states, power-plan states and the stateless Xbox command">
  <title>Boolean states, power-plan states and the stateless Xbox command</title>
  <rect width="1920" height="960" fill="#0a0a0b"/>
  <rect x="96" y="65" width="48" height="48" rx="8" fill="#132013" stroke="#294429"/>
  <text x="120" y="99" fill="#46c246" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">M</text>
  <text x="164" y="100" fill="#f2f2f3" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">MAECLY</text>
  <text x="330" y="99" fill="#a3a3ad" font-family="Consolas, monospace" font-size="22" font-weight="400" text-anchor="start">02 / FEEDBACK</text>
  <text x="1824" y="100" fill="#46c246" font-family="Consolas, monospace" font-size="23" font-weight="600" text-anchor="end">v2.1.0</text>
  <text x="96" y="217" fill="#f2f2f3" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" text-anchor="start">The right feedback for every action.</text><rect x="96" y="275" width="552" height="440" rx="16" fill="#161619" stroke="#29292f"/><rect x="684" y="275" width="552" height="440" rx="16" fill="#161619" stroke="#29292f"/><rect x="1272" y="275" width="552" height="440" rx="16" fill="#161619" stroke="#29292f"/><text x="128" y="324" fill="#46c246" font-family="Consolas, monospace" font-size="22" font-weight="400" text-anchor="start">BOOLEAN SETTINGS</text><svg data-asset="pointer-precision-on" x="177" y="365" width="156" height="156" viewBox="0 0 144 144">
  <rect width="144" height="144" rx="24" fill="#6d3cff"/>
  <path d="M42 25v79l20-18 14 30 15-7-14-30 27-2Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="103" cy="39" r="11" fill="none" stroke="#fff" stroke-width="6" opacity=".75"/>
  <path d="M103 21v8m0 20v8m-18-18h8m20 0h8" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg><svg data-asset="pointer-precision-off" x="411" y="365" width="156" height="156" viewBox="0 0 144 144">
  <rect width="144" height="144" rx="24" fill="#1a1a1d"/>
  <path d="M42 25v79l20-18 14 30 15-7-14-30 27-2Z" fill="#8a8a90" stroke="#8a8a90" stroke-width="5" stroke-linejoin="round"/>
</svg><text x="255" y="563" fill="#46c246" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">ON</text><text x="489" y="563" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">OFF</text><text x="128" y="630" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Write, re-read, confirm.</text>
<text x="128" y="666.4" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Show the value Windows kept.</text><text x="716" y="324" fill="#54b8ff" font-family="Consolas, monospace" font-size="22" font-weight="400" text-anchor="start">POWER PLANS</text><svg data-asset="power-plan-a" x="724" y="388" width="128" height="128" viewBox="0 0 144 144">
  <rect width="144" height="144" rx="24" fill="#0067c0"/>
  <path d="M77 18 38 79h28l-9 47 49-72H77Z" fill="#fff"/>
  <circle cx="112" cy="112" r="19" fill="#fff"/><text x="112" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#0067c0">A</text>
</svg><text x="788" y="563" fill="#54b8ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">A</text><svg data-asset="power-plan-b" x="896" y="388" width="128" height="128" viewBox="0 0 144 144">
  <rect width="144" height="144" rx="24" fill="#e8a400"/>
  <path d="M77 18 38 79h28l-9 47 49-72H77Z" fill="#fff"/>
  <circle cx="112" cy="112" r="19" fill="#fff"/><text x="112" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#8a5d00">B</text>
</svg><text x="960" y="563" fill="#54b8ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">B</text><svg data-asset="power-plan-other" x="1068" y="388" width="128" height="128" viewBox="0 0 144 144">
  <rect width="144" height="144" rx="24" fill="#1a1a1d"/>
  <path d="M77 18 38 79h28l-9 47 49-72H77Z" fill="#8a8a90"/>
  <circle cx="112" cy="112" r="19" fill="#3a3a40"/><text x="112" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#c9c9cf">?</text>
</svg><text x="1132" y="563" fill="#54b8ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">OTHER</text><text x="716" y="630" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">A, B or another active plan.</text>
<text x="716" y="666.4" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">No invented ON/OFF state.</text><text x="1304" y="324" fill="#46c246" font-family="Consolas, monospace" font-size="22" font-weight="400" text-anchor="start">XBOX COMMAND</text><svg data-asset="xbox-mode" x="1470" y="365" width="156" height="156" viewBox="0 0 144 144">
  <rect width="144" height="144" rx="24" fill="#107c10"/>
  <path d="M35 34h74a11 11 0 0 1 11 11v54a11 11 0 0 1-11 11H35a11 11 0 0 1-11-11V45a11 11 0 0 1 11-11Z" fill="none" stroke="#fff" stroke-width="8"/>
  <path d="M45 82V62h20M99 62H79M45 62l18 18m36 2V62L81 80" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="49" y="94" width="46" height="6" rx="3" fill="#fff" opacity=".55"/>
</svg><text x="1548" y="563" fill="#46c246" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">WIN + F11</text><text x="1304" y="630" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Send the full-screen shortcut.</text>
<text x="1304" y="666.4" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">A command, not a toggle state.</text><text x="96" y="794" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Stateful actions re-check Windows every 2.5 seconds. Xbox Mode remains stateless.</text>
  <path d="M96 854H1824" stroke="#29292f"/>
  <text x="96" y="902" fill="#a3a3ad" font-family="Consolas, monospace" font-size="22" font-weight="400" text-anchor="start">WINDOWS 11  /  STREAM DECK 7.1+</text>
  <text x="1824" y="902" fill="#a3a3ad" font-family="Consolas, monospace" font-size="21" font-weight="400" text-anchor="end">MIT · OPEN SOURCE · EN / ES</text>
</svg>
