<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960" role="img" aria-label="Local Windows controls without administrator rights or telemetry">
  <title>Local Windows controls without administrator rights or telemetry</title>
  <rect width="1920" height="960" fill="#0a0a0b"/>
  <rect x="96" y="65" width="48" height="48" rx="8" fill="#132013" stroke="#294429"/>
  <text x="120" y="99" fill="#46c246" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">M</text>
  <text x="164" y="100" fill="#f2f2f3" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">MAECLY</text>
  <text x="330" y="99" fill="#a3a3ad" font-family="Consolas, monospace" font-size="22" font-weight="400" text-anchor="start">05 / BOUNDARIES</text>
  <text x="1824" y="100" fill="#46c246" font-family="Consolas, monospace" font-size="23" font-weight="600" text-anchor="end">v2.1.0</text>
  <text x="96" y="213" fill="#f2f2f3" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" text-anchor="start">Local controls. Clear boundaries.</text><text x="96" y="281" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" text-anchor="start">No administrator rights. No telemetry. No external service required.</text><rect x="96" y="357" width="552" height="350" rx="16" fill="#161619" stroke="#29292f"/><text x="128" y="407" fill="#46c246" font-family="Consolas, monospace" font-size="22" font-weight="400" text-anchor="start">01 / USER PREFERENCES</text><text x="128" y="516" fill="#f2f2f3" font-family="Segoe UI, Arial, sans-serif" font-size="65" font-weight="700" text-anchor="start">HKCU</text><text x="128" y="607" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Game Mode · controller Game Bar</text>
<text x="128" y="640.6" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Auto HDR · windowed optimizations</text><rect x="684" y="357" width="552" height="350" rx="16" fill="#161619" stroke="#29292f"/><text x="716" y="407" fill="#b39aff" font-family="Consolas, monospace" font-size="22" font-weight="400" text-anchor="start">02 / WINDOWS APIS</text><text x="716" y="516" fill="#f2f2f3" font-family="Segoe UI, Arial, sans-serif" font-size="65" font-weight="700" text-anchor="start">Win32</text><text x="716" y="607" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Pointer precision · Win+F11</text>
<text x="716" y="640.6" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Keeps custom mouse thresholds</text><rect x="1272" y="357" width="552" height="350" rx="16" fill="#161619" stroke="#29292f"/><text x="1304" y="407" fill="#54b8ff" font-family="Consolas, monospace" font-size="22" font-weight="400" text-anchor="start">03 / EXISTING POWER PLANS</text><text x="1304" y="516" fill="#f2f2f3" font-family="Segoe UI, Arial, sans-serif" font-size="65" font-weight="700" text-anchor="start">powercfg</text><text x="1304" y="607" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">List, read and activate only</text>
<text x="1304" y="640.6" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">No plan creation, editing or deletion</text><text x="96" y="783" fill="#a3a3ad" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Xbox Mode requires compatible Windows 11 and GamingHomeApp configured.</text>
  <path d="M96 854H1824" stroke="#29292f"/>
  <text x="96" y="902" fill="#a3a3ad" font-family="Consolas, monospace" font-size="22" font-weight="400" text-anchor="start">WINDOWS 11  /  STREAM DECK 7.1+</text>
  <text x="1824" y="902" fill="#a3a3ad" font-family="Consolas, monospace" font-size="21" font-weight="400" text-anchor="end">MIT · OPEN SOURCE · EN / ES</text>
</svg>
